<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotogalerie 3. ročníku – Čtu ve městě</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&family=Merriweather:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--lilac:#dac1ff;--pink:#fe005c;--paper:#f9f9f9;--head:"Bricolage Grotesque",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--lilac)}
body{padding:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px}.grid::after{content:"";flex-grow:1e4}
.tile{flex-grow:calc(var(--r)*100);flex-basis:calc(var(--r)*230px);position:relative;display:block;overflow:hidden;background:rgba(0,0,0,.08);cursor:zoom-in}
.tile i{display:block}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease,filter .35s ease}
.tile:hover img,.tile:focus-visible img{transform:scale(1.04);filter:brightness(1.05)}
.tile:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain;user-select:none}
.lb button{position:absolute;background:none;border:0;color:var(--paper);cursor:pointer;font-family:var(--head);padding:14px}
.lb button:hover,.lb a:hover{color:var(--lilac)}
.lb .x{top:4px;right:10px;font-size:34px;line-height:1}
.lb .prev,.lb .next{top:50%;transform:translateY(-50%);font-size:44px;padding:22px 14px}
.lb .prev{left:4px}.lb .next{right:4px}
.lb .bar{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:20px;color:var(--paper);font:15px var(--head)}
.lb .bar a{color:var(--paper)}
@media(max-width:600px){body{padding:8px}.grid{gap:5px}.tile{flex-basis:calc(var(--r)*100px)}}
h1{font:700 clamp(24px,3.2vw,34px)/1.2 var(--head);color:#1c1c1c;text-align:center;margin:8px auto 22px;max-width:900px}
.note{font:300 15px/1.6 Merriweather,Georgia,serif;color:#1c1c1c;text-align:center;max-width:640px;margin:30px auto 14px}
.note a{color:inherit;font-weight:400;text-underline-offset:3px}
.note a:hover{color:var(--pink)}
</style></head><body>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Zvětšená fotografie">
<button class="x" aria-label="Zavřít">×</button><button class="prev" aria-label="Předchozí">‹</button>
<img id="img" alt=""><button class="next" aria-label="Další">›</button>
<div class="bar"><span id="cnt"></span><a id="dl" download target="_blank" rel="noopener">Stáhnout</a></div></div>
<script>
(function(){
var t=[].slice.call(document.querySelectorAll('#grid .tile')),lb=document.getElementById('lb'),im=document.getElementById('img'),
cnt=document.getElementById('cnt'),dl=document.getElementById('dl'),c=0,last=null;
function show(i){c=(i+t.length)%t.length;var a=t[c];im.src=a.getAttribute('href');im.alt=a.querySelector('img').alt;
dl.href=a.getAttribute('href');cnt.textContent=(c+1)+' / '+t.length;new Image().src=t[(c+1)%t.length].getAttribute('href');}
function open(i){last=document.activeElement;show(i);lb.classList.add('open');lb.querySelector('.x').focus();}
function close(){lb.classList.remove('open');im.removeAttribute('src');if(last)last.focus();}
t.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();open(i);});});
lb.querySelector('.x').onclick=close;lb.querySelector('.prev').onclick=function(){show(c-1)};lb.querySelector('.next').onclick=function(){show(c+1)};
lb.addEventListener('click',function(e){if(e.target===lb)close();});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;
if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(c-1);else if(e.key==='ArrowRight')show(c+1);});
var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50)show(c+(d<0?1:-1));});
})();
</script></body></html>
